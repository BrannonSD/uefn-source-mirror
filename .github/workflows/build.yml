name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Audit public files and history
        run: python scripts/check_public_repo.py
      - name: Build self-contained Windows app
        run: dotnet publish src/VerseMirror.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o app
      - name: Run safety tests
        shell: pwsh
        run: |
          $test = Start-Process './app/UEFN Source Mirror.exe' -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/UEFNSourceMirror/self-test.json"
          if ($test.ExitCode -ne 0) { throw 'Self-tests failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uefn-source-mirror-windows-x64
          path: |
            app/UEFN Source Mirror.exe
            app/mirror.ico
